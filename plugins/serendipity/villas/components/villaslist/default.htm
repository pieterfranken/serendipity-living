{% set items = __SELF__.villas %}
{% if items|length %}
<div class="sl-villas-grid">
  {% for v in items %}
    {% partial 'villas/card' villa=v sold=false delivery=v.delivery_date %}
  {% endfor %}
</div>
{% else %}
  <p class="sl-lead">New villas are being curated. Please check back shortly.</p>
{% endif %}
